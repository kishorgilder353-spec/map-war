function maybeReq(){if(!S||!cnt()[S.me])return;const me=S.me;S.req=S.req.filter(r=>S.turn-r.t<=3&&S.owner.includes(r.c)&&S.owner.includes(r.d)&&allied(r.c,me)&&!allied(r.d,me)&&!treaty(r.d,me)&&atWar(r.c,r.d));if(S.req.length>=3||Math.random()>.1)return;const cand=[];S.ally.forEach(k=>{const [a,b]=k.split('-').map(Number),c=a===me?b:b===me?a:-1;if(c<0)return;S.war.forEach(w=>{const [x,y]=w.split('-').map(Number),d=x===c?y:y===c?x:-1;if(d>=0&&d!==me&&!atWar(d,me)&&!allied(d,me)&&!treaty(d,me)&&!S.req.some(r=>r.c===c&&r.d===d))cand.push([c,d])})});
if(!cand.length)return;const [c,d]=cand[Math.random()*cand.length|0];S.req.push({c,d,t:S.turn});updTop()}
function supp(i,ok){const r=S.req[i];S.req.splice(i,1);updTop();if(!r)return;if(!ok){toast('已拒绝盟友的请求');return statsModal()}const d=r.d;wage(S.me,d);const cand=[];for(let p=1;p<=P;p++){if(S.owner[p-1]!==S.me||S.T[p]<20)continue;const q=[...NB[p],...SN[p]].find(x=>S.owner[x-1]===d);if(q)cand.push([p,q])}
cand.sort((a,b)=>S.T[b[0]]-S.T[a[0]]);let k=0;const used=new Set();for(const [p,q] of cand){if(k>=3)break;if(used.has(p))continue;used.add(p);S.ord.push({a:p,b:q,n:S.T[p]-1,c:S.me});S.T[p]=1;k++}
toast(k?`已派出 ${k} 支军队进攻 ${CN[d][1]}，下回合结算`:`已向 ${CN[d][1]} 宣战，但没有可进攻的相邻目标`);render();updTop();kick();statsModal()}
function reqList(){return S.req.length?`<div>🤝 盟友请求支援（${S.req.length}）</div>`+S.req.map((r,i)=>`<div class="it"><span style="flex:1">${CN[r.c][1]} 请你进攻 ${CN[r.d][1]}<br><small>${3-(S.turn-r.t)} 回合内有效</small></span><button class="b c2 sm" onclick="supp(${i},1)">同意</button><button class="b c5 sm" onclick="supp(${i},0)">拒绝</button></div>`).join(''):''}
function askAllies(d){const me=S.me,al=S.ally.map(k=>k.split('-').map(Number)).filter(x=>x.includes(me)).map(x=>x[0]===me?x[1]:x[0]).filter(c=>cnt()[c]);$('menu').innerHTML=`<div class="box"><h3>🆘 请求盟友支援 → ${CN[d][1]}</h3>${al.length?al.map(a=>`<div class="it"><img src="${flag(a)}" style="width:26px;height:18px"><span style="flex:1;margin-left:6px">${CN[a][1]}</span><button class="b c2 sm" onclick="askAlly(${a},${d})">请求</button></div>`).join(''):'<div>你还没有盟友</div>'}<button class="b c1 sm" onclick="$('menu').style.display='none'">关闭</button></div>`;$('menu').style.display='flex'}
function askAlly(a,d){const k='h'+key(a,S.me);if(S.turn<(S.cd[k]||0))return toast(`${CN[a][1]} ${S.cd[k]-S.turn}回合后才能再次请求`);if(treaty(a,d)||allied(a,d)){return toast(CN[a][1]+'无法对该国作战')}
S.cd[k]=S.turn+3;if(Math.random()>.6){toast(CN[a][1]+'拒绝了支援请求');return askAllies(d)}if(!atWar(a,d))wage(a,d);const cand=[];for(let p=1;p<=P;p++){if(S.owner[p-1]!==a||S.T[p]<100)continue;const q=[...NB[p],...SN[p]].find(x=>S.owner[x-1]===d);if(q)cand.push([p,q])}
cand.sort((x,y)=>S.T[y[0]]-S.T[x[0]]);let n=0;const used=new Set();for(const [p,q] of cand){if(n>=3)break;if(used.has(p))continue;used.add(p);S.ord.push({a:p,b:q,n:S.T[p]-1,c:a});S.T[p]=1;n++}
$('menu').style.display='none';toast(n?`${CN[a][1]}同意支援，派出 ${n} 支军队进攻 ${CN[d][1]}`:`${CN[a][1]}同意了，但没有相邻目标可进攻`);news(`🤝 ${CN[a][1]} 应 ${CN[S.me][1]} 的请求进攻 ${CN[d][1]}`);render();kick()}
let tmode=0,tmk=0,fxl=[];
const NRES=[3000,6000,9000,10000,12000],ARES=[2000,5000,7000,9000,10000],spow=k=>1+.5*S.sl[k],scost=k=>(k==='n'?10000:6000)*(S.sl[k]+1);
function cancelWar(a,b){const keepo=[];S.ord.forEach(o=>{const cb=S.owner[o.b-1];if((o.c===a&&cb===b)||(o.c===b&&cb===a))landArmy(o.a,o.c,o.n,o.a);else keepo.push(o)});S.ord=keepo;S.str=S.str.filter(s=>{const cb=S.owner[s.to-1];return!((s.c===a&&cb===b)||(s.c===b&&cb===a))})}
function rsRow(k){const r=S.rs[k],nm=k==='n'?'☢ 核弹':'✈ 战斗机',arr=k==='n'?NRES:ARES;
if(r.done)return `<div class="it"><span style="flex:1">${nm} Lv.${S.sl[k]}<br><small>威力 ×${spow(k)} ${k==='n'?'（中心 '+fmt(10000*spow(k))+' / 周围 '+fmt(5000*spow(k))+'）':'（每次 '+fmt(5000*spow(k))+'，连打3回合）'}</small></span>${S.sl[k]<5?`<button class="b c1 sm" onclick="upgS('${k}')">升级 ${fmt(scost(k))}💰</button>`:''}</div>`;
return `<div class="it"><span style="flex:1">${nm} 研究 ${r.st}/5<br><small>${r.st<5?'首都研究：下一阶段投入 '+fmt(arr[r.st])+'（每回合一次）':'本回合结束时完成'}</small></span>${r.st<5?`<button class="b ${r.last===S.turn?'c4':'c3'} sm" onclick="research('${k}')">${r.last===S.turn?'本回合已投入':'投入 '+fmt(arr[r.st])+'💰'}</button>`:''}</div>`}
function research(k){const r=S.rs[k],arr=k==='n'?NRES:ARES;if(r.done||r.st>=5)return;if(!S.cap[S.me]||S.owner[S.cap[S.me]-1]!==S.me)return toast('需要拥有首都才能研究');if(r.last===S.turn)return toast('本回合已投入，下回合继续');const cost=arr[r.st];if(S.mode!=='create'){if(S.gold[S.me]<cost)return toast('金币不足');S.gold[S.me]-=cost}r.st++;r.last=S.turn;toast(`${k==='n'?'核弹':'战斗机'}研究 ${r.st}/5${r.st>=5?'，本回合结束时完成':''}`);updTop();openMenu()}
function upgS(k){const c=scost(k);if(S.sl[k]>=5)return;if(S.mode!=='create'){if(S.gold[S.me]<c)return toast('金币不足');S.gold[S.me]-=c}S.sl[k]++;updTop();openMenu()}
function updBtns(){if(!S)return;$('bn').classList.toggle('lock',!S.rs.n.done);$('bf').classList.toggle('lock',!S.rs.a.done);$('bn').classList.toggle('on',tmode==='n');$('bf').classList.toggle('on',tmode==='a')}
function strikeBtn(k){if(k==='n'&&S.era<3)return toast('这个时代还没有核武器');if(k==='a'&&S.era<2)return toast('这个时代还没有战斗机');if(!S.rs[k].done){toast('还没研究完成：在“国家”菜单里投入研究资金');openMenu();return}tmode=tmode===k?0:k;tmk=0;toast(tmode?'点击地图选择攻击目标（再点一次按钮取消）':'已取消');updBtns();kick();draw()}
$('bn').onclick=()=>strikeBtn('n');$('bf').onclick=()=>strikeBtn('a');
function confirmStrike(k,t){const me=S.me,cb=S.owner[t-1],cap=S.cap[me];if(cb===me||allied(cb,me))return toast('不能攻击己方或盟友的省份');if(treaty(cb,me))return toast('条约期内不能攻击');
const d=Math.hypot(CX[cap]-CX[t],CY[cap]-CY[t]),eta=k==='n'?Math.min(6,Math.max(1,Math.ceil(d/350))):Math.min(3,Math.max(1,Math.ceil(d/600))),cost=k==='n'?10000:7000;tmk=t;kick();draw();
$('menu').innerHTML=`<div class="box"><h3>${k==='n'?'☢ 核打击':'✈ 战斗机空袭'} → ${CN[cb][1]}</h3><div>${k==='n'?`中心 ${fmt(10000*spow('n'))} 兵力伤害，周围 8 个区块各 ${fmt(5000*spow('n'))}`:`连续 3 回合，每回合 ${fmt(5000*spow('a'))} 兵力伤害`}<br>从首都出发，<b>${eta}</b> 回合后到达<br>花费 ${fmt(cost)}💰 + 1🔜</div><div class="row"><button class="b c5" id="sno">取消</button><button class="b c2" id="sgo">发射</button></div></div>`;$('menu').style.display='flex';
$('sno').onclick=()=>{$('menu').style.display='none';tmk=0;draw()};$('sgo').onclick=()=>launchStrike(k,t,eta,cost)}
function launchStrike(k,t,eta,cost){$('menu').style.display='none';const me=S.me,cb=S.owner[t-1];if(S.mode!=='create'&&S.gold[me]<cost){tmk=0;return toast('金币不足')}if(!spend(1))return;if(S.mode!=='create')S.gold[me]-=cost;if(!atWar(cb,me))wage(me,cb);
S.str.push({k,c:me,from:S.cap[me],to:t,eta,eta0:eta,left:k==='a'?3:1});news(`${k==='n'?'☢ ':'✈ '}${CN[me][1]} 对 ${CN[cb][1]} 发动${k==='n'?'核打击':'空袭'}，${eta}回合后到达`);toast(`已发射，${eta}回合后到达`);tmode=0;tmk=0;updBtns();updTop();render();kick()}
function bomb(p,dmg,pf){let d=dmg;const tk=Math.min(d,S.T[p]);S.T[p]-=tk;d-=tk;for(const g of garAt(p)){const x=Math.min(d,g.n);g.n-=x;d-=x}S.gar=S.gar.filter(g=>g.n>0);S.pop[p]=Math.max(50,Math.round(S.pop[p]*pf))}
function strike(s){const pw=s.c===S.me?1+.5*S.sl[s.k]:1,t=s.to;fxl.push({p:t,t0:performance.now(),k:s.k});kick();
if(s.k==='n'){bomb(t,10000*pw,.6);[...NB[t]].sort((a,b)=>Math.hypot(CX[a]-CX[t],CY[a]-CY[t])-Math.hypot(CX[b]-CX[t],CY[b]-CY[t])).slice(0,8).forEach(q=>bomb(q,5000*pw,.8));news(`☢ ${CN[s.c][1]} 的核弹命中 ${CN[S.owner[t-1]][1]}！`)}
else{bomb(t,5000*pw,.97);news(`✈ ${CN[s.c][1]} 的战斗机空袭 ${CN[S.owner[t-1]][1]}（第${3-s.left+1}轮）`)}}
function strikesDraw(t){if(!S||!S.str)return;const sz=Math.max(5,Math.min(9,view.s*2.2));cx.lineCap='round';
for(const s of S.str){const x1=CX[s.from]*view.s+view.x,y1=CY[s.from]*view.s+view.y,x2=CX[s.to]*view.s+view.x,y2=CY[s.to]*view.s+view.y,col=s.k==='n'?'#ff7a1a':'#4da3ff',pr=s.hit?1:Math.min(1,(s.eta0-s.eta)/s.eta0);
if(!s.hit)chev(x1,y1,x2,y2,t,col,sz);const mx=x1+(x2-x1)*pr,my=y1+(y2-y1)*pr,r=16+5*Math.sin(t/180);cx.strokeStyle=col;cx.lineWidth=3;cx.beginPath();cx.arc(x2,y2,r,0,7);cx.stroke();
cx.font='22px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';cx.fillText(s.k==='n'?'☢':'✈',s.hit?x2:mx,s.hit?y2:my);cx.font='bold 11px sans-serif';cx.lineWidth=3;cx.strokeStyle='#000d';const m=s.k==='a'&&s.hit?`剩${s.left}轮`:`${s.eta}回合`;cx.strokeText(m,x2,y2+r+10);cx.fillText(m,x2,y2+r+10)}
if(tmk){const x=CX[tmk]*view.s+view.x,y=CY[tmk]*view.s+view.y,r=20+6*Math.sin(t/150);cx.strokeStyle='#ff2a2a';cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,7);cx.moveTo(x-r-6,y);cx.lineTo(x+r+6,y);cx.moveTo(x,y-r-6);cx.lineTo(x,y+r+6);cx.stroke()}
fxl=fxl.filter(f=>t-f.t0<1600);for(const f of fxl){const x=CX[f.p]*view.s+view.x,y=CY[f.p]*view.s+view.y,k=Math.max(0,(t-f.t0)/1600),r=(f.k==='n'?90:40)*k*Math.max(.6,view.s/2);cx.globalAlpha=1-k;cx.fillStyle=f.k==='n'?'#ff9d2e':'#9cc9ff';cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.globalAlpha=1}}
const ptr=new Map();let moved=0,pd=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=0};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===1){view.x+=e.clientX-o[0];view.y+=e.clientY-o[1];moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1])}else if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoom(d/pd,(a[0]+b[0])/2,(a[1]+b[1])/2)}pd=d;moved=99}draw()};
cv.onpointerup=e=>{ptr.delete(e.pointerId);if(!ptr.size&&moved<8)pick(e.clientX,e.clientY);pd=0};
cv.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87,e.clientX,e.clientY);draw()};
function zoom(f,x,y){const n=Math.max(.3,Math.min(view.s*f,12));f=n/view.s;view.x=x-(x-view.x)*f;view.y=y-(y-view.y)*f;view.s=n}
function pick(x,y){if(!S)return;const mx=Math.floor((x-view.x)/view.s),my=Math.floor((y-view.y)/view.s),t=mx>=0&&my>=0&&mx<W&&my<H?ID[my*W+mx]:0;if(tmode){if(!t)return toast('请点击陆地省份');confirmStrike(tmode,t);return}if(mode&&sel&&t&&t!==sel&&(S.owner[sel-1]===S.me||myG(sel))){if(canHit(sel,t)){go(sel,t);return}const sp=seaPath(sel,t);if(sp){go(sel,t,sp);return}}mode=0;sel=t;render();updPanel()}
